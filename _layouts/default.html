<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'pt-BR' }}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b141a" />
  {% if page.referrer_policy %}<meta name="referrer" content="{{ page.referrer_policy }}">{% endif %}
  {% seo %}
  <link rel="icon" type="image/png" href="{{ '/assets/images/hackinbrasil.png' | relative_url }}">
  <link rel="preload" href="{{ '/assets/fonts/space-grotesk-variable-latin.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" type="text/css" href="{{ '/assets/css/fonts.css' | relative_url }}">
  <link rel="stylesheet" type="text/css" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  {{ content }}
  {% include footer.html %}
  <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
</body>
</html>
